<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>slack-xport</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1d1c1d;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #4a154b;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    #exportBtn {
      background: #4a154b;
      color: white;
    }
    #exportBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #downloadBtn {
      background: #007a5a;
      color: white;
      display: none;
      margin-top: 8px;
    }
    #status {
      margin-top: 10px;
      color: #616061;
      min-height: 20px;
      font-size: 13px;
    }
    #error {
      margin-top: 10px;
      color: #e01e5a;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>slack-xport</h1>
  <button id="exportBtn">Export Search Results</button>
  <button id="downloadBtn">Download TSV</button>
  <div id="status"></div>
  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
