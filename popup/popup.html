<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>slack-xport</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1d1c1d;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #4a154b;
    }
    .state {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      background: #f4f4f4;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .state .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .state.ready { background: #e6f4ea; color: #007a5a; }
    .state.ready .dot { background: #007a5a; }
    .state.warn { background: #fff8e1; color: #8a6d3b; }
    .state.warn .dot { background: #d4a017; }
    .state.error { background: #fbe9eb; color: #b03a4a; }
    .state.error .dot { background: #e01e5a; }

    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    #mainBtn {
      background: #4a154b;
      color: white;
    }
    #mainBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #mainBtn.copied {
      background: #007a5a;
    }
    #confirmCopyBtn {
      background: #007a5a;
      color: white;
      display: none;
      margin-top: 8px;
    }
    #downloadBtn {
      background: none;
      color: #616061;
      font-weight: normal;
      font-size: 12px;
      display: none;
      margin-top: 4px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 0;
    }
    #status {
      margin-top: 10px;
      color: #616061;
      min-height: 20px;
      font-size: 13px;
    }
    #progress {
      margin-top: 6px;
      width: 100%;
      height: 4px;
      background: #e8e8e8;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    #progressBar {
      height: 100%;
      background: #4a154b;
      width: 0%;
      transition: width 0.25s ease;
    }
    #progress.indeterminate #progressBar {
      width: 30%;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(333%); }
    }
    #error {
      margin-top: 10px;
      color: #e01e5a;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>slack-xport</h1>
  <div id="state" class="state">
    <span class="dot"></span>
    <span id="stateText">Checking page…</span>
  </div>
  <button id="mainBtn" disabled>Export &amp; Copy</button>
  <button id="confirmCopyBtn">Copy anyway</button>
  <button id="downloadBtn">Download as YAML file</button>
  <div id="status"></div>
  <div id="progress"><div id="progressBar"></div></div>
  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
